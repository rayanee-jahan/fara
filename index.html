<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #1e293b;
      --card: rgba(255, 255, 255, 0.1);
      --card-strong: rgba(255, 255, 255, 0.16);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --border: rgba(255, 255, 255, 0.12);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Vazirmatn, sans-serif;
      background:
        radial-gradient(circle at top right, #1d4ed8 0%, transparent 25%),
        radial-gradient(circle at top left, #0ea5e9 0%, transparent 20%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      width: min(1150px, calc(100% - 32px));
      margin: 32px auto 48px;
    }

    .hero {
      background: linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0.08));
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      margin-bottom: 24px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(1.7rem, 3vw, 2.5rem);
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.9;
      font-size: 1rem;
    }

    .controls {
      display: grid;
      grid-template-columns: 1.5fr 220px 160px;
      gap: 14px;
      margin: 22px 0;
    }

    .control-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px 14px;
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
    }

    input, select {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
    }

    input::placeholder {
      color: #cbd5e1cc;
    }

    select option {
      color: #111827;
    }

    .stats {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      min-width: 180px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
    }

    .table-wrap {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: rgba(15, 23, 42, 0.72);
      color: #e0f2fe;
      font-size: 0.95rem;
      letter-spacing: 0.2px;
      padding: 18px 16px;
      text-align: right;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tbody tr {
      transition: background 0.2s ease, transform 0.2s ease;
    }

    tbody tr:nth-child(even) {
      background: rgba(255,255,255,0.03);
    }

    tbody tr:hover {
      background: rgba(56, 189, 248, 0.10);
    }

    td {
      padding: 14px 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
      vertical-align: middle;
    }

    .price {
      font-weight: bold;
      color: #bbf7d0;
      white-space: nowrap;
    }

    .badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.16);
      color: #dcfce7;
      border: 1px solid rgba(34, 197, 94, 0.25);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
    }

    .empty {
      text-align: center;
      padding: 28px;
      color: var(--muted);
      display: none;
    }

    .footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.92rem;
      text-align: center;
    }

    @media (max-width: 860px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .container {
        width: min(100% - 20px, 1000px);
      }

      thead th, td {
        padding: 12px 10px;
        font-size: 0.95rem;
      }

      .hero {
        padding: 20px;
      }
    }
  </style>
</head>

    const tableBody = document.getElementById("bookTable");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");
    const filterSelect = document.getElementById("filterSelect");
    const countShown = document.getElementById("countShown");
    const countAll = document.getElementById("countAll");
    const emptyState = document.getElementById("emptyState");

    function formatPrice(price) {
      if (price === null || price === undefined) return "تماس بگیرید";
      return price.toLocaleString("fa-IR") + " ریال";
    }

    function renderTable() {
      const searchValue = searchInput.value.trim().toLowerCase();
      const sortValue = sortSelect.value;
      const filterValue = filterSelect.value;

      let filtered = [...books].filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(searchValue);
        const matchesFilter =
          filterValue === "all" ||
          (filterValue === "books" && item.type === "کتاب") ||
          (filterValue === "packages" && item.type === "بسته");
        return matchesSearch && matchesFilter;
      });

      if (sortValue === "priceAsc") {
        filtered.sort((a, b) => (a.price ?? Number.MAX_SAFE_INTEGER) - (b.price ?? Number.MAX_SAFE_INTEGER));
      } else if (sortValue === "priceDesc") {
        filtered.sort((a, b) => (b.price ?? -1) - (a.price ?? -1));
      } else if (sortValue === "nameAsc") {
        filtered.sort((a, b) => a.name.localeCompare(b.name, "fa"));
      }

      tableBody.innerHTML = filtered.map(item => `
        <tr>
          <td>${item.name}</td>
          <td><span class="badge">${item.type}</span></td>
          <td class="price">${formatPrice(item.price)}</td>
        </tr>
      `).join("");

      countShown.textContent = filtered.length.toLocaleString("fa-IR");
      countAll.textContent = books.length.toLocaleString("fa-IR");
      emptyState.style.display = filtered.length ? "none" : "block";
    }

    searchInput.addEventListener("input", renderTable);
    sortSelect.addEventListener("change", renderTable);
    filterSelect.addEventListener("change", renderTable);

    renderTable();
  </script>
